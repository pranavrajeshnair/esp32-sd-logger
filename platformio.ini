[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

; --- FIX FOR COMPILER CRASH ---
; -O0: Turn off all optimizations (Compiler does less work, so less likely to crash)
; -fno-var-tracking: Disable a specific feature known to cause Segmentation Faults
build_flags = 
    -O0
    -fno-var-tracking